[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcfa"
version = "0.1.0"
description = "Research infrastructure for single Skill update studies"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "fastjsonschema>=2.21,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
dcfa = "dcfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcfa = ["scs.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
